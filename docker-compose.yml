version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: usdt247-app
    restart: unless-stopped

    # IMPORTANT: Choose ONE of the following network configurations based on your OS:

    # Option 1: For Linux - Use host network mode (RECOMMENDED for Linux)
    # This allows the container to access localhost:3306 on the host directly
    # Uncomment the line below if you're on Linux:
    network_mode: host

    # Option 2: For macOS/Windows - Use bridge network with extra_hosts
    # This maps 'localhost' inside the container to the host machine
    # Comment out the 'ports' and 'extra_hosts' sections if using network_mode: host
    # ports:
    #   - '${PORT:-8001}:${PORT:-8001}'
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      # Application Configuration (non-sensitive, can be overridden)
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8001}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database Configuration
      # Sensitive values are loaded from .env file via env_file directive
      # These are here for documentation and can be overridden
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # Pay Configuration
      API_PAY: ${API_PAY}
      PARTNER_APP_KEY: ${PARTNER_APP_KEY}

      # Webhook Configuration
      WEBHOOK_PUBLIC_KEY: ${WEBHOOK_PUBLIC_KEY}

    volumes:
      # Mount logs directory to persist logs on host
      - ./logs:/app/logs

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
