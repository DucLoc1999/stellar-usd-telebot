version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: usdt247-app
    restart: unless-stopped

    ports:
      - '${PORT:-8001}:${PORT:-8001}'

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8001}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # Mount logs directory to persist logs on host
      # The docker-entrypoint.sh script automatically fixes permissions at startup
      # This works correctly on Linux with host network mode
      # Update data folder
      - ./logs:/app/logs
      - ./data:/app/data

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - payment-network

networks:
  payment-network:
    external: true
