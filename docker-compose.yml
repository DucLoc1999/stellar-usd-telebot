version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: usdt247-app
    restart: unless-stopped

    # ============================================================================
    # NETWORK CONFIGURATION - LINUX DEPLOYMENT
    # ============================================================================
    # Using host network mode for Linux deployment
    # This allows the container to directly access services on the host (e.g., MySQL on localhost:3306)
    #
    # Benefits:
    # - Direct access to host's localhost without IP mapping
    # - No port mapping needed (container uses host's network stack)
    # - Better performance (no network translation overhead)
    #
    # Note: host network mode only works on Linux
    # For macOS/Windows deployment, see commented configuration below
    network_mode: host

    # ============================================================================
    # ALTERNATIVE: macOS/Windows Configuration (COMMENTED OUT)
    # ============================================================================
    # Uncomment the following lines and comment out 'network_mode: host' above
    # if deploying on macOS or Windows:
    #
    # ports:
    #   - '${PORT:-8001}:${PORT:-8001}'
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    #
    # Also update DB_HOST in .env file to: host.docker.internal
    # ============================================================================

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      # Application Configuration (non-sensitive, can be overridden)
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8001}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Swagger/OpenAPI Configuration
      # Production URL for Swagger UI (e.g., https://api.yourdomain.com)
      # Leave empty for development (will use localhost:PORT)
      URL_SWAGGER: ${URL_SWAGGER}

      # Database Configuration
      # Sensitive values are loaded from .env file via env_file directive
      #
      # LINUX DEPLOYMENT: DB_HOST should be 'localhost' (using host network mode)
      # macOS/Windows: DB_HOST should be 'host.docker.internal' (using bridge network)
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # Pay Configuration
      API_PAY: ${API_PAY}
      PARTNER_APP_KEY: ${PARTNER_APP_KEY}

      # Webhook Configuration
      WEBHOOK_PUBLIC_KEY: ${WEBHOOK_PUBLIC_KEY}

    volumes:
      # Mount logs directory to persist logs on host
      # The docker-entrypoint.sh script automatically fixes permissions at startup
      # This works correctly on Linux with host network mode
      # Update data folder
      - ./logs:/app/logs
      - ./data:/app/data

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
